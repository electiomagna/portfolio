<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project | Nikolai Volkov Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <script src="projects-data.js" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const requestedId = params.get("id");
      const project = portfolioProjects.find(({ id }) => id === requestedId) || portfolioProjects[0];

      document.title = `${project.title} | Nikolai Volkov Portfolio`;

      const title = document.querySelector("[data-project-title]");
      const video = document.querySelector("[data-project-video]");
      const description = document.querySelector("[data-project-description]");
      const gallery = document.querySelector("[data-project-gallery]");
      const relatedProjects = document.querySelector("[data-related-projects]");
      const projectIndex = portfolioProjects.findIndex(({ id }) => id === project.id);
      const previousProject = portfolioProjects[(projectIndex - 1 + portfolioProjects.length) % portfolioProjects.length];
      const nextProject = portfolioProjects[(projectIndex + 1) % portfolioProjects.length];

      title.textContent = project.title;
      description.textContent = project.description;

      const videoType = project.video.endsWith(".mov") ? "video/quicktime" : "video/mp4";
      video.innerHTML = `<source src="${project.video}" type="${videoType}">`;
      video.load();
      video.setAttribute("aria-label", `Видео проекта ${project.title}`);

      gallery.innerHTML = project.gallery
        .map((src, index) => `<img class="project-gallery__image" src="${src}" alt="${project.title}, кадр ${index + 1}">`)
        .join("");

      relatedProjects.innerHTML = [previousProject, nextProject]
        .map((relatedProject, index) => `
          <a class="related-project-card" href="project-page.html?id=${relatedProject.id}">
            <img src="${relatedProject.preview}" alt="${relatedProject.title}">
            <span class="related-project-card__meta">${index === 0 ? "previous project" : "next project"}</span>
            <span class="related-project-card__title">${relatedProject.title}</span>
          </a>
        `)
        .join("");
    });
  </script>
</head>
<body class="project-page">
  <!-- Шапка страницы проекта: возврат к главной и навигация по проекту. -->
  <header class="site-header">
    <a class="brand" href="index.html">nikolai volkov</a>
    <nav class="site-nav" aria-label="Навигация страницы проекта">
      <a href="index.html#about">about</a>
      <a href="index.html#projects">projects</a>
      <a href="index.html#contact">contact</a>
    </nav>
  </header>

  <!-- Страница проекта: заголовок, видео, описание и полноширинная галерея. -->
  <main class="page">
    <section id="motion" class="project-detail">
      <h1 class="project-detail__title" data-project-title></h1>

      <video class="project-detail__video project-detail__video--wide" data-project-video controls preload="metadata" playsinline></video>

      <div id="about-project" class="project-detail__text">
        <p data-project-description></p>
      </div>
    </section>

    <section id="gallery" class="project-gallery" aria-label="Галерея проекта" data-project-gallery></section>

    <section class="related-projects" aria-label="Предыдущий и следующий проект">
      <p class="related-projects__label">featured projects</p>
      <div class="related-projects__grid" data-related-projects></div>
    </section>
  </main>

  <!-- Футер с контактной информацией. -->
